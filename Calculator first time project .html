<!DOCTYPEhtml>
<html lang="en">
<head>
<meta charset="utf-8" >
<meta http-equiv="x-UA-compatible" content="IE=edge">

<meta name="viewport" content="width=device-width,intial-scale=1.0" />
<title>CALCULATOR-BY CODE HTML AND CSS</title>
<link rel="stylesheet"href="noname.html">
<style>
*{
margin:0;
paddin:0;
box-sizeing:border-box;
/* google font*/
font-family:'poppins',sans-serif;
}
body{
width:100%;
height: 100vh;
display: flex;
justify-content: center;
align-items:center;
background: linear-gradient(45deg,#0a0a0a,#3a4452);
}

.calculator{
border:1px solid #717377;
border-radius: 16px;
background:transparent;
box-shadow:0px 3px 15px rgba(113,115,119,0.5);
}
input{
width:320px;
border:none;
padding:24px;
margin:10px;
background: transparent;
box-shadow: 0px 3px 15px rgba(84,84,84,0.1);
font-size:40px;
text-align:right;
cursor:pointer;
}
input::placeholder{
color:#ffffff;
}
button{
 border: none;
 width: 60px;
 height:60px;
 margin:10px;
 border-radius:50%;
 background: transparent;
 color: #ffffff;
 font-size:20px;
 box-shadow:-8px -8px 15px rgba(255,255.255,0.1);
cursor: pointer;
}
.equalbtn{
background-color: #fb7c14;
}
.operator{
color:aquamarine;
}




</style>
</head>

<body>
<div class="calculator">
<input type="text" placeholder="0" id="inputbox">
<div>
<button class="operator"> AC</button>
<button class="operator"> DEL</button>
<button class="operator"> %</button>
<button class="operator"> /</button>
</div>
<div>
<button> 7</button>
<button> 8</button>
<button> 9</button>
<button class="operator"> *</button>
</div>
<div>
<button> 4</button>
<button> 5</button>
<button> 6</button>
<button class="operator"> -</button>
</div>
<div>
<button> 1</button>
<button> 2</button>
<button> 3</button>
<button class="operator"> +</button>
</div>
<div>
<button> 00</button>
<button> 0</button>
<button> .</button>
<button class="equalbtn"> =</button>
</div>
</div>
<script>
    let input = document.getElementById('inputbox');
    let buttons = document.querySelectorAll('button');
    let string = "";

    buttons.forEach(button => {
        button.addEventListener('click', (e) => {
            // Button ke text se extra space hatane ke liye .trim() lagaya hai
            let btnText = e.target.innerHTML.trim();

            if (btnText === '=') {
                try {
                    // Agar screen khali hai to kuch na karein
                    if (string === "") return;
                    
                    // Calculation karein aur result dikhayein
                    string = eval(string).toString();
                    input.value = string;
                } catch (error) {
                    // Galat expression (jaise 5++2) hone par Error dikhayein
                    input.value = "Error";
                    string = "";
                }
            } 
            else if (btnText === 'AC') {
                // Sab kuch clear karne ke liye
                string = "";
                input.value = string;
            } 
            else if (btnText === 'DEL') {
                // Aakhiri ek digit ya symbol delete karne ke liye
                string = string.slice(0, -1);
                input.value = string;
            } 
            else {
                // Numbers aur operators ko screen par jodne ke liye
                string += btnText;
                input.value = string;
            }
        });
    });
</script>



</body>
</html>
